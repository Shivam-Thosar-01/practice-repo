    <!-- In this lecture i learn to use table in a web page 
    table is used to represent data in row and coumn format
    tag used for make a table
    1.<table></table>       -- main table
    2.<thead></thead>       -- table header
    3.<tbody></tbody>       -- table body
    4.<tfoot></tfoot>       -- talble footer
    5.<th></th>             -- used for table heading
    6.<tr></tr>             -- used to make table row
    7.<td></td>             -- udes to insert data in a cell
    
    In table to increase row and column size use attribute
    1.row       -   rowspan="2"
    2.column    -   colspan
     -->

     <table border="1">
