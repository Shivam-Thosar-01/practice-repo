<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Template Areas</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f4;
        }

        .container{
            width: 90%;
            max-width: 1200px;
            padding: 20px;

            display: grid;
            gap: 15px;

            grid-template-columns: 1fr 1fr 1fr;

            grid-template-areas:
                "header header header"
                "sidebar content1 content2"
                "sidebar content3 content3"
                "footer footer footer";
        }

        .box{
            background-color: royalblue;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 12px;
            min-height: 150px;
        }

        .header{
            grid-area: header;
            background-color: #ff6b6b;
        }

        .sidebar{
            grid-area: sidebar;
            background-color: #4ecdc4;
        }

        .content1{
            grid-area: content1;
        }

        .content2{
            grid-area: content2;
        }

        .content3{
            grid-area: content3;
        }

        .footer{
            grid-area: footer;
            background-color: #222;
        }

        /* Responsive Design */
        @media (max-width: 768px){
            .container{
                grid-template-columns: 1fr;

                grid-template-areas:
                    "header"
                    "sidebar"
                    "content1"
                    "content2"
                    "content3"
                    "footer";
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box header">Header</div>
        <div class="box sidebar">Sidebar</div>
        <div class="box content1">Content 1</div>
        <div class="box content2">Content 2</div>
        <div class="box content3">Content 3</div>
        <div class="box footer">Footer</div>
    </div>

</body>
</html>
