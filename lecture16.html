<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #div1{
            border: 2px solid black;
            height: 300px;
            background-color: aqua;
            width: 300px;
            margin: 10px;
             padding: 15px;
        }

        #div2{
            border: 2px solid black;
            height: 300px;
            width: 300px;
            background-color: aquamarine;
            display: inline;
            padding: 15px;
            margin: 10px;
        }

        #div3{
            border: 2px solid black;
            height: 300px;
            background-color: blue;
            width: 300px;
            margin: 10px;
             padding: 15px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <!-- in this lecture i learn about a display property there are 3 type of display value
    1.inline            -(margin is only applied horizontal)&(height&width does not affect to inline element)
    2.block             -padding ,margin,height,width all works
    3.inline block      -element work as inline but all property of block element work on it means padding ,margin,height,width all works/
     -->

    <div id="div1">
        this is div 1
    </div>

    <div id="div2">
        this is div 2
    </div>

    <div id="div3">
        this is div 3
    </div>
</body>
</html>
