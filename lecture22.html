<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bos&text shadow</title>

    <style>
        *{
            margin: 0px;
            padding: 0%;
            --primary-color:brown;
        }

        .container{
            height: 80vh;
            width: 100vw;
            margin: 10px;
            padding: 10px;
            background-color: rgb(251, 249, 249);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        img{
            height: 300px;
            width: 300px;
            /* border: 1px solid brown; */
            border-radius: 10px;
            border-top-left-radius: 50px;
            
            box-shadow: 4px 4px 15px 4px var(--primary-color);
        }
        p{
            font-size: 30px;
            color: rgb(184, 177, 211);
            margin: 20px;
            text-shadow: 1px 1px rgb(105, 122, 205);
        }
    </style>
</head>
<body>
    
<!-- 
    in this lecture i learn a box & text shodow
    1.box shadow
        it is used to give ashadow to a box 
        syntax-
        box-shadow:2px 4px 5px 3px red;
        
        2px -it is for x axis it move the shadow on x axis
        4px -it is for y axis it move the shadow on y axis
        5px -this specify a blur of a shadow
        3px -it define a spread shaddow
        red it define a color of shadow

        we can apply multiple shadow to a box by using a comma

        we can also use a shadow inside box
        syntax-
        box-shadow:inset 2px 5px red;

    2. text shadow
        it has a same syntax as a bix shadow but it does not have a spread space parameter
        syntax-
        box-shadow:2px 4px 5px 3px red;
         we can apply multiple shadow to a text by using a comma


    int his leture i also learn a declare  a variable
    syntax-
    --variable name:value;
    ex:--primary-color:red;

    if we define it in a specifoc container then it is limited to it ,to make it acesible to every where write it inside a root element
    :root{
        --primary-color:red;
    }

-->


    <div class="container">
        <img src="brandlogo.png" alt="brand logo">
        <p>Logo</p>
    </div>
</body>
</html>
