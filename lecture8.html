        <h2>Complex form</h2>

        <form>
            <fieldset>

                <legend>Personal information</legend>
                <label for="name">Enter name:</label>
                <input type="text" id="name" placeholder="Shivam Thosar">

                <label for="Email">Enter email:</label>
                <input type="email" id="Email" placeholder="shivathosar@gmail.com">

                <label for="phone">Enter Phone</label>
                <input type="tel" id="phone" placeholder="9922852921">
                
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob">

                <span>Gender</span>

                <input type="radio" id="male" name="gender">
                <label for="male">male</label>

                <input type="radio" id="female" name="gender">
                <label for="female">female</label>

                <label for="Country">Country</label>
                <select name="country" id="country">
                    <option value="India">India</option>
                    <option value="US">united state</option>
                </select>

            </fieldset>
            <br/>
            <fieldset>
                <legend>Adress 

                <label for="street">street:</label><input type="text" id="street" name="address">
                <label for="city">City:</label><input type="text" id="city" name="address">
                <label for="state">State:</label><input type="text" id="state" name="address">
                <label for="zipcode">Zip Code:</label><input type="text" id="zipcode" name="address"></legend>
            </fieldset>
            <br/>
            <fieldset>
                <legend>Other Information</legend>

                <label for="Comments">Comments</label>
                <textarea name="Comments" id="Cooments" placeholder="write here something" cols="10" rows="5"></textarea>
                <label for="Terms">I agree to the term and service </label>
                <input type="checkbox" id="Terms">
                <br/>
                <button>Submit</button>
            </fieldset>
        </form>
